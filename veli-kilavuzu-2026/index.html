<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kağıthane Çözüm Koleji - Veli Kılavuzu 2026-2027</title>
  <!-- PageFlip Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .flip-container {
      width: 100%;
      max-width: 1200px;
      height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    /* Alt Kontrol Çubuğu */
    .controls {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: #fff;
    }
    .btn {
      background: #c82333;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #a71d2a;
    }
    .btn-secondary {
      background: #333333;
    }
    .btn-secondary:hover {
      background: #444444;
    }
    .page-info {
      font-size: 14px;
      color: #ddd;
      min-width: 90px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="flip-container">
    <div id="book"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-prev">‹ Önceki</button>
    <span class="page-info" id="page-num">Sayfa: 1 / 20</span>
    <button class="btn" id="btn-next">Sonraki ›</button>
    <button class="btn btn-secondary" id="btn-fullscreen">⛶ Tam Ekran</button>
  </div>

  <script>
    // Belirlediğiniz özel sayfa dizilimi:
    // 1, 4, 2, 3, 5, 6, 8, 7, 19, 20, 11, 10, 12, 9, 13, 15, 16, 17, 18, 14
    const pageOrder = [
      "pdfpdf-01.jpg",
      "pdfpdf-04.jpg",
      "pdfpdf-02.jpg",
      "pdfpdf-03.jpg",
      "pdfpdf-05.jpg",
      "pdfpdf-06.jpg",
      "pdfpdf-08.jpg",
      "pdfpdf-07.jpg",
      "pdfpdf-19.jpg",
      "pdfpdf-20.jpg",
      "pdfpdf-11.jpg",
      "pdfpdf-10.jpg",
      "pdfpdf-12.jpg",
      "pdfpdf-09.jpg",
      "pdfpdf-13.jpg",
      "pdfpdf-15.jpg",
      "pdfpdf-16.jpg",
      "pdfpdf-17.jpg",
      "pdfpdf-18.jpg",
      "pdfpdf-14.jpg"
    ];

    const bookElement = document.getElementById("book");

    // Sayfaları DOM'a yükle
    pageOrder.forEach((file, index) => {
      const pageDiv = document.createElement("div");
      pageDiv.className = "page";
      if (index === 0 || index === pageOrder.length - 1) {
        pageDiv.setAttribute("data-density", "hard"); // Ön ve arka kapak sert kapak olsun
      }
      pageDiv.innerHTML = `<img src="images/${file}" alt="Sayfa ${index + 1}">`;
      bookElement.appendChild(pageDiv);
    });

    // PageFlip Motorunu Başlat
    const pageFlip = new St.PageFlip(bookElement, {
      width: 900,
      height: 506,
      size: "stretch",
      minWidth: 320,
      maxWidth: 1200,
      minHeight: 180,
      maxHeight: 700,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll(".page"));

    // Buton ve Durum Yönetimi
    const pageNum = document.getElementById("page-num");
    document.getElementById("btn-prev").addEventListener("click", () => pageFlip.flipPrev());
    document.getElementById("btn-next").addEventListener("click", () => pageFlip.flipNext());

    pageFlip.on("flip", (e) => {
      pageNum.innerText = `Sayfa: ${e.data + 1} / ${pageOrder.length}`;
    });

    // Tam Ekran Kontrolü
    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veli Kılavuzu 2026-2027 | Kağıthane Çözüm Koleji</title>

  <!-- Swiper 3D Motoru -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.95);
      --border: rgba(226, 232, 240, 0.95);
      --cozum-red: #c9182b;
      --cozum-red-hover: #a51323;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 100%);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
    }

    /* Üst İnce Bilgi Şeridi */
    .top-bar {
      height: 42px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .badge-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cozum-red);
    }

    .jump-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      
    }

    .page-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Çalışma Alanı */
    .workspace {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      min-height: 0;
      position: relative;
    }

    .book-stage {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 110px);
      position: relative;
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.16);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      perspective: 2500px; /* 3D derinlik */
    }

    /* Sol Kenar Defter Sırtı / Cilt Dikiş Gölgesi */
    .book-stage::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 26px;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.16) 0%, rgba(0, 0, 0, 0.05) 50%, transparent 100%);
      z-index: 25;
      pointer-events: none;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Alt Araç Çubuğu */
    .toolbar-container {
      padding: 0 16px 10px;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
    }

    .btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--cozum-red);
      color: #ffffff;
    }

    .btn.primary:hover:not(:disabled) {
      background: var(--cozum-red-hover);
    }

    .page-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 80px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <div class="badge-title">
      <span class="badge-dot"></span>
      <strong>Kağıthane Çözüm Koleji</strong>
      <span style="color: var(--text-muted); font-weight: normal;">· Veli Kılavuzu</span>
    </div>

    <div class="jump-wrapper">
      <label for="page-dropdown">Sayfa:</label>
      <select id="page-dropdown" class="page-select"></select>
    </div>
  </header>

  <main class="workspace">
    <div class="book-stage">
      <div class="swiper">
        <div class="swiper-wrapper" id="slide-wrapper"></div>
      </div>
    </div>
  </main>

  <div class="toolbar-container">
    <nav class="toolbar">
      <button class="btn" id="btn-prev" disabled>‹ Önceki</button>
      <div class="page-indicator" id="page-num">1 / 24</div>
      <button class="btn primary" id="btn-next">Sonraki ›</button>
      <button class="btn" id="btn-fs" title="Tam Ekran">⛶</button>
    </nav>
  </div>

  <script>
    (() => {
      "use strict";

      // Kesin 24 sayfalık sıralama
      const pageOrder = [
        1, 4, 2, 3, 5, 6, 8, 7,
        19, 20, 21, 22, 23, 24,
        11, 10, 12, 9, 13, 15,
        16, 17, 18, 14
      ];

      const TOTAL = pageOrder.length;
      const slideWrapper = document.getElementById("slide-wrapper");
      const pageNum = document.getElementById("page-num");
      const pageDropdown = document.getElementById("page-dropdown");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnFs = document.getElementById("btn-fs");

      let swiperInstance = null;

      pageOrder.forEach((pageFileNum, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${index + 1}. Sayfa`;
        pageDropdown.appendChild(option);
      });

      pageOrder.forEach((num, index) => {
        const pad = String(num).padStart(2, "0");
        const slide = document.createElement("div");
        slide.className = "swiper-slide";
        
        const img = document.createElement("img");
        img.alt = `Veli Kılavuzu Sayfa ${index + 1}`;
        img.src = `images/pdfpdf-${pad}.jpg`;
        
        img.onerror = function() {
          if (this.src.endsWith(".jpg")) {
            this.src = `images/pdfpdf-${pad}.jpeg`;
          }
        };

        slide.appendChild(img);
        slideWrapper.appendChild(slide);
      });

      function updateUI(index) {
        pageNum.textContent = `${index + 1} / ${TOTAL}`;
        pageDropdown.value = index;
        btnPrev.disabled = index <= 0;
        btnNext.disabled = index >= TOTAL - 1;
      }

      // Defter Sayfası Çevirme Motoru (Sol Sırttan Katlama)
      swiperInstance = new Swiper('.swiper', {
        effect: 'creative',
        speed: 700,
        grabCursor: true,
        creativeEffect: {
          perspective: true,
          prev: {
            shadow: true,
            origin: 'left center',        // Dönme ekseni tam sol kenar (defter sırtı)
            translate: [0, 0, -10],
            rotate: [0, -95, 0],          // Sola doğru sayfayı katlar
            opacity: 0.15
          },
          next: {
            shadow: true,
            origin: 'left center',
            translate: [0, 0, -1],         // Alttaki sayfa sırtta hazır bekler
            opacity: 1
          }
        },
        keyboard: {
          enabled: true
        },
        on: {
          init: function() {
            updateUI(this.activeIndex);
          },
          slideChange: function() {
            updateUI(this.activeIndex);
          }
        }
      });

      btnPrev.addEventListener("click", () => swiperInstance && swiperInstance.slidePrev());
      btnNext.addEventListener("click", () => swiperInstance && swiperInstance.slideNext());

      pageDropdown.addEventListener("change", (e) => {
        if (swiperInstance) swiperInstance.slideTo(parseInt(e.target.value, 10));
      });

      btnFs.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>

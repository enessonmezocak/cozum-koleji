<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veli Kılavuzu 2026-2027 | Kağıthane Çözüm Koleji</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.95);
      --border: rgba(226, 232, 240, 0.95);
      --cozum-red: #c9182b;
      --cozum-red-hover: #a51323;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 100%);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Üst İnce Şerit */
    .top-bar {
      height: 42px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .badge-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cozum-red);
    }

    .jump-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .page-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Kitap Alanı - Tek Sayfayı Tam Boya Genişletir */
    .workspace {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      position: relative;
      min-height: 0;
    }

    .book-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #book {
      margin: auto;
    }

    .page {
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Alt Araç Çubuğu */
    .toolbar-container {
      padding: 0 16px 10px;
      display: flex;
      justify-content: center;
      z-index: 5;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
    }

    .btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--cozum-red);
      color: #ffffff;
    }

    .btn.primary:hover:not(:disabled) {
      background: var(--cozum-red-hover);
    }

    .page-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 80px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Yükleniyor Katmanı */
    .loader {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--cozum-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <div class="badge-title">
      <span class="badge-dot"></span>
      <strong>Kağıthane Çözüm Koleji</strong>
      <span style="color: var(--text-muted); font-weight: normal;">· Veli Kılavuzu</span>
    </div>

    <div class="jump-wrapper">
      <label for="page-dropdown">Sayfa:</label>
      <select id="page-dropdown" class="page-select"></select>
    </div>
  </header>

  <main class="workspace">
    <div class="book-wrapper">
      <div id="book"></div>

      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Kılavuz hazırlanıyor...</div>
      </div>
    </div>
  </main>

  <div class="toolbar-container">
    <nav class="toolbar">
      <button class="btn" id="btn-prev" disabled>‹ Önceki</button>
      <div class="page-indicator" id="page-num">1 / 24</div>
      <button class="btn primary" id="btn-next">Sonraki ›</button>
      <button class="btn" id="btn-fs" title="Tam Ekran">⛶</button>
    </nav>
  </div>

  <script>
    (() => {
      "use strict";

      const pageOrder = [
        1, 4, 2, 3, 5, 6, 8, 7,
        19, 20, 21, 22, 23, 24,
        11, 10, 12, 9, 13, 15,
        16, 17, 18, 14
      ];

      const TOTAL = pageOrder.length;
      const book = document.getElementById("book");
      const loader = document.getElementById("loader");
      const pageNum = document.getElementById("page-num");
      const pageDropdown = document.getElementById("page-dropdown");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnFs = document.getElementById("btn-fs");

      let pageFlip = null;

      pageOrder.forEach((pageFileNum, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${index + 1}. Sayfa`;
        pageDropdown.appendChild(option);
      });

      function getUrls(num) {
        const pad = String(num).padStart(2, "0");
        return [
          `images/pdfpdf-${pad}.jpg`,
          `images/pdfpdf-${pad}.jpeg`,
          `images/pdfpdf-${pad}.JPG`,
          `images/pdfpdf-${pad}.JPEG`
        ];
      }

      function createPageElement(num, index) {
        const pageDiv = document.createElement("div");
        pageDiv.className = "page";

        const img = document.createElement("img");
        img.alt = `Kılavuz Sayfa ${index + 1}`;
        img.decoding = "async";

        const urls = getUrls(num);
        let uIdx = 0;

        function tryLoad() {
          if (uIdx >= urls.length) return;
          img.src = urls[uIdx++];
        }

        img.onerror = tryLoad;
        tryLoad();

        pageDiv.appendChild(img);
        return pageDiv;
      }

      pageOrder.forEach((num, idx) => {
        book.appendChild(createPageElement(num, idx));
      });

      function updateControls(index) {
        pageNum.textContent = `${index + 1} / ${TOTAL}`;
        pageDropdown.value = index;
        btnPrev.disabled = index <= 0;
        btnNext.disabled = index >= TOTAL - 1;
      }

      function initPageFlip() {
        if (!window.St || !window.St.PageFlip) return;

        pageFlip = new St.PageFlip(book, {
          width: 900,
          height: 506,
          size: "stretch",
          minWidth: 320,
          maxWidth: 1200,
          minHeight: 180,
          maxHeight: 675,
          maxShadowOpacity: 0.25,
          showCover: false, // Tek sayfada kapak ayrımı yapmaz
          mobileScrollSupport: false,
          flippingTime: 500,
          usePortrait: true
        });

        // Kütüphaneyi kesin olarak TEK SAYFA (portrait) moduna kilitler
        if (pageFlip.render) {
          pageFlip.render.calculateOrientation = () => "portrait";
          if (typeof pageFlip.render.setOrientation === "function") {
            pageFlip.render.setOrientation("portrait");
          }
        }

        pageFlip.loadFromHTML(book.querySelectorAll(".page"));

        pageFlip.on("flip", (e) => {
          updateControls(e.data);
        });

        pageFlip.on("init", () => {
          loader.classList.add("hidden");
          updateControls(pageFlip.getCurrentPageIndex());
        });

        setTimeout(() => {
          loader.classList.add("hidden");
        }, 1200);
      }

      btnPrev.addEventListener("click", () => pageFlip && pageFlip.flipPrev());
      btnNext.addEventListener("click", () => pageFlip && pageFlip.flipNext());

      pageDropdown.addEventListener("change", (e) => {
        if (pageFlip) pageFlip.flip(parseInt(e.target.value, 10));
      });

      btnFs.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      document.addEventListener("keydown", (e) => {
        if (!pageFlip) return;
        if (e.key === "ArrowRight") pageFlip.flipNext();
        if (e.key === "ArrowLeft") pageFlip.flipPrev();
      });

      window.addEventListener("load", initPageFlip);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Veli Kılavuzu 2026-2027 | Kağıthane Çözüm Koleji</title>

  <!-- Swiper 3D & Zoom Motoru -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.96);
      --border: rgba(226, 232, 240, 0.95);
      --cozum-red: #c9182b;
      --cozum-red-hover: #a51323;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 100%);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Üst İnce Bilgi Şeridi */
    .top-bar {
      height: 42px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .badge-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cozum-red);
    }

    .jump-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .page-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Çalışma Alanı */
    .workspace {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      min-height: 0;
      position: relative;
    }

    .book-stage {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 105px);
      position: relative;
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.16);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      perspective: 2500px;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Swiper Zoom Konteyneri */
    .swiper-zoom-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swiper-zoom-container img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Alt Araç Çubuğu */
    .toolbar-container {
      padding: 0 16px 10px;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
    }

    .btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--cozum-red);
      color: #ffffff;
    }

    .btn.primary:hover:not(:disabled) {
      background: var(--cozum-red-hover);
    }

    .page-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      min-width: 75px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Mobil İpucu Rozeti */
    .mobile-hint {
      position: absolute;
      top: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      pointer-events: none;
      z-index: 15;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    /* Mobil Optimizasyonu (Ekranı Maksimum Doldurma) */
    @media (max-width: 650px) {
      .top-bar {
        height: 38px;
        padding: 0 8px;
      }
      .badge-title span {
        display: none;
      }
      .workspace {
        padding: 0; /* Sıfır kenar boşluğuyla kenarlara tam oturur */
      }
      .book-stage {
        border-radius: 0;
        box-shadow: none;
        max-height: calc(100vh - 90px);
      }
      .toolbar {
        padding: 4px 8px;
        gap: 4px;
      }
      .btn {
        padding: 6px 10px;
        font-size: 12px;
      }
      .page-indicator {
        font-size: 12px;
        min-width: 60px;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <div class="badge-title">
      <span class="badge-dot"></span>
      <strong>Kağıthane Çözüm Koleji</strong>
      <span style="color: var(--text-muted); font-weight: normal;">· Veli Kılavuzu</span>
    </div>

    <div class="jump-wrapper">
      <label for="page-dropdown">Sayfa:</label>
      <select id="page-dropdown" class="page-select"></select>
    </div>
  </header>

  <main class="workspace">
    <div class="mobile-hint" id="mobile-hint">🔍 Çift dokunarak büyütebilirsiniz</div>

    <div class="book-stage">
      <div class="swiper">
        <div class="swiper-wrapper" id="slide-wrapper"></div>
      </div>
    </div>
  </main>

  <div class="toolbar-container">
    <nav class="toolbar">
      <button class="btn" id="btn-prev" disabled>‹ Önceki</button>
      <div class="page-indicator" id="page-num">1 / 24</div>
      <button class="btn primary" id="btn-next">Sonraki ›</button>
      <button class="btn" id="btn-zoom" title="Büyüt / Küçült">🔍+</button>
      <button class="btn" id="btn-fs" title="Tam Ekran">⛶</button>
    </nav>
  </div>

  <script>
    (() => {
      "use strict";

      const pageOrder = [
        1, 4, 2, 3, 5, 6, 8, 7,
        19, 20, 21, 22, 23, 24,
        11, 10, 12, 9, 13, 15,
        16, 17, 18, 14
      ];

      const TOTAL = pageOrder.length;
      const slideWrapper = document.getElementById("slide-wrapper");
      const pageNum = document.getElementById("page-num");
      const pageDropdown = document.getElementById("page-dropdown");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnZoom = document.getElementById("btn-zoom");
      const btnFs = document.getElementById("btn-fs");
      const mobileHint = document.getElementById("mobile-hint");

      let swiperInstance = null;

      // Açılır menüyü doldur
      pageOrder.forEach((pageFileNum, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${index + 1}. Sayfa`;
        pageDropdown.appendChild(option);
      });

      // Slaytları Zoom Konteyneri ile birlikte oluştur
      pageOrder.forEach((num, index) => {
        const pad = String(num).padStart(2, "0");
        const slide = document.createElement("div");
        slide.className = "swiper-slide";
        
        const zoomBox = document.createElement("div");
        zoomBox.className = "swiper-zoom-container";

        const img = document.createElement("img");
        img.alt = `Veli Kılavuzu Sayfa ${index + 1}`;
        img.src = `images/pdfpdf-${pad}.jpg`;
        
        img.onerror = function() {
          if (this.src.endsWith(".jpg")) {
            this.src = `images/pdfpdf-${pad}.jpeg`;
          }
        };

        zoomBox.appendChild(img);
        slide.appendChild(zoomBox);
        slideWrapper.appendChild(slide);
      });

      function updateUI(index) {
        pageNum.textContent = `${index + 1} / ${TOTAL}`;
        pageDropdown.value = index;
        btnPrev.disabled = index <= 0;
        btnNext.disabled = index >= TOTAL - 1;
      }

      // Çift Yönlü Defter Sayfası Çevirme Motoru
      swiperInstance = new Swiper('.swiper', {
        effect: 'creative',
        speed: 650,
        grabCursor: true,
        zoom: {
          maxRatio: 3,
          minRatio: 1,
          toggle: true // Çift dokunmayla büyütme
        },
        creativeEffect: {
          perspective: true,
          limitProgress: 2,
          shadowPerProgress: true,
          prev: {
            shadow: true,
            origin: 'left center',          // İleri giderken sol kenardan kıvrılarak sola gider
            translate: ['-15%', 0, -20],
            rotate: [0, -100, 0],
            opacity: 0
          },
          next: {
            shadow: true,
            origin: 'right center',         // Geri giderken sağ kenardan kıvrılarak sağa döner
            translate: ['15%', 0, -20],
            rotate: [0, 100, 0],
            opacity: 0
          }
        },
        keyboard: {
          enabled: true
        },
        on: {
          init: function() {
            updateUI(this.activeIndex);
          },
          slideChange: function() {
            updateUI(this.activeIndex);
          },
          zoomChange: function(swiper, scale) {
            btnZoom.textContent = scale > 1 ? "🔍-" : "🔍+";
          }
        }
      });

      // İpucunu 3.5 saniye sonra gizle
      setTimeout(() => {
        if (mobileHint) mobileHint.style.opacity = "0";
      }, 3500);

      // Buton İşlevleri
      btnPrev.addEventListener("click", () => swiperInstance && swiperInstance.slidePrev());
      btnNext.addEventListener("click", () => swiperInstance && swiperInstance.slideNext());

      pageDropdown.addEventListener("change", (e) => {
        if (swiperInstance) swiperInstance.slideTo(parseInt(e.target.value, 10));
      });

      // Tek Tıkla Yakınlaştır / Uzaklaştır
      btnZoom.addEventListener("click", () => {
        if (!swiperInstance || !swiperInstance.zoom) return;
        if (swiperInstance.zoom.scale > 1) {
          swiperInstance.zoom.out();
          btnZoom.textContent = "🔍+";
        } else {
          swiperInstance.zoom.in(2.2);
          btnZoom.textContent = "🔍-";
        }
      });

      // Tam Ekran
      btnFs.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Kağıthane Çözüm Koleji 2026-2027 Veli Kılavuzu">

  <title>Veli Kılavuzu | Kağıthane Çözüm Koleji</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg: #111827;
      --panel: #1b2536;
      --line: rgba(255,255,255,.11);
      --text: #f8fafc;
      --muted: #9caec5;
      --red: #df3545;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 43%, #29384e 0%, #182336 45%, #0c1320 100%);
    }

    button {
      font: inherit;
    }

    .header {
      height: 76px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(13, 20, 33, .75);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #f04b58, #bf1e32);
      box-shadow: 0 5px 20px #df354530;
      font-size: 24px;
      font-weight: 900;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.3px;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .year {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 30px;
      color: #dbe5f2;
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px 4px;
    }

    .book-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #book {
      margin: auto;
    }

    /* Kâğıt görünümü */
    .page {
      overflow: hidden;
      background: #fffdf8;
      box-shadow: 0 3px 12px #00000018;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fffdf8;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loader {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-align: center;
      color: #c4d0df;
      background: rgba(17, 24, 39, .96);
      transition: opacity .25s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #ffffff20;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-message {
      font-size: 13px;
    }

    .loading-error {
      max-width: 520px;
      padding: 14px;
      color: #fecaca;
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .toolbar {
      width: min(760px, calc(100% - 32px));
      min-height: 68px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px auto 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(27, 37, 54, .95);
      box-shadow: 0 16px 45px #00000025;
    }

    .btn {
      min-height: 42px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #273449;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      transition: background .2s, transform .2s;
    }

    .btn:hover:not(:disabled) {
      background: #384960;
    }

    .btn:active:not(:disabled) {
      transform: scale(.97);
    }

    .btn.primary {
      border-color: transparent;
      background: var(--red);
    }

    .btn.primary:hover:not(:disabled) {
      background: #c72c3b;
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .page-counter {
      min-width: 112px;
      text-align: center;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .page-counter small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
    }

    .progress {
      width: min(360px, 60%);
      height: 3px;
      margin: 0 auto 12px;
      overflow: hidden;
      border-radius: 5px;
      background: #ffffff15;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--red);
      transition: width .3s ease;
    }

    .footer {
      flex: 0 0 auto;
      padding: 0 12px 9px;
      text-align: center;
      color: #8292a9;
      font-size: 10px;
    }

    button:focus-visible {
      outline: 2px solid #fca5a5;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .header {
        height: 64px;
        padding: 9px 12px;
      }

      .brand {
        gap: 9px;
      }

      .brand-logo {
        width: 37px;
        height: 37px;
        border-radius: 11px;
        font-size: 20px;
      }

      .brand-title {
        font-size: 12px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .year {
        padding: 7px 8px;
        font-size: 10px;
      }

      .workspace {
        padding: 8px 3px 2px;
      }

      .toolbar {
        width: calc(100% - 16px);
        min-height: 58px;
        gap: 5px;
        margin: 6px auto 9px;
        padding: 7px 5px;
        border-radius: 14px;
      }

      .btn {
        min-height: 39px;
        padding: 0 9px;
        gap: 4px;
        font-size: 11px;
      }

      .page-counter {
        min-width: 72px;
        font-size: 11px;
      }

      .page-counter small {
        font-size: 9px;
      }

      .fullscreen-label {
        display: none;
      }

      .footer {
        font-size: 9px;
        padding-bottom: 6px;
      }

      .progress {
        margin-bottom: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">Ç</div>
      <div>
        <h1 class="brand-title">Kağıthane Çözüm Koleji</h1>
        <p class="brand-subtitle">Dijital Veli Kılavuzu</p>
      </div>
    </div>

    <div class="year">2026 – 2027</div>
  </header>

  <main class="workspace">
    <section class="book-stage" aria-label="Sayfa çevirmeli veli kılavuzu">
      <div id="book"></div>

      <div class="loader" id="loader" role="status">
        <div class="spinner" id="spinner"></div>
        <div class="loading-message" id="loading-message">
          Kılavuz hazırlanıyor...
        </div>
        <div class="loading-error" id="loading-error" hidden></div>
      </div>
    </section>
  </main>

  <div class="progress" aria-hidden="true">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <nav class="toolbar" aria-label="Kitap kontrolleri">
    <button class="btn" id="prev" type="button" disabled>
      ‹ <span>Önceki</span>
    </button>

    <div class="page-counter" id="page-counter" aria-live="polite">
      Hazırlanıyor...
      <small>24 sayfa</small>
    </div>

    <button class="btn primary" id="next" type="button" disabled>
      <span>Sonraki</span> ›
    </button>

    <button class="btn" id="fullscreen" type="button" aria-label="Tam ekran">
      ⛶ <span class="fullscreen-label">Tam ekran</span>
    </button>
  </nav>

  <footer class="footer">
    KAĞITHANE ÇÖZÜM KOLEJİ · 2026–2027 EĞİTİM ÖĞRETİM YILI
  </footer>

  <script>
    (() => {
      "use strict";

      // Sıralama kesinlikle bu dizideki gibidir.
      const pageOrder = [
        1, 4, 2, 3, 5, 6, 8, 7,
        19, 20, 21, 22, 23, 24,
        11, 10, 12, 9, 13, 15,
        16, 17, 18, 14
      ];

      const TOTAL = pageOrder.length;
      const book = document.getElementById("book");
      const loader = document.getElementById("loader");
      const spinner = document.getElementById("spinner");
      const loadingMessage = document.getElementById("loading-message");
      const loadingError = document.getElementById("loading-error");
      const counter = document.getElementById("page-counter");
      const progress = document.getElementById("progress-fill");
      const prevButton = document.getElementById("prev");
      const nextButton = document.getElementById("next");
      const fullscreenButton = document.getElementById("fullscreen");

      let pageFlip = null;
      let resizeTimer = null;
      let errors = [];

      // Dosyaların jpg/jpeg uzantı farkını otomatik kontrol et.
      // Dosya adlarında 01, 02 gibi sıfır dolgusu korunur.
      function candidates(number) {
        const base = "pdfpdf-" + String(number).padStart(2, "0");
        return [
          `images/${base}.jpg`,
          `images/${base}.jpeg`,
          `images/${base}.JPG`,
          `images/${base}.JPEG`
        ];
      }

      function createPage(number, index) {
        const page = document.createElement("div");
        page.className = "page";

        if (index === 0 || index === TOTAL - 1) {
          page.dataset.density = "hard";
        }

        const img = document.createElement("img");
        img.alt = `Veli kılavuzu sayfa ${number}`;
        img.decoding = "async";
        img.draggable = false;

        if (index < 4) {
          img.fetchPriority = "high";
        }

        const urls = candidates(number);
        let candidateIndex = 0;
        let resolved = false;

        function tryNext() {
          if (resolved) return;

          if (candidateIndex >= urls.length) {
            errors.push(number);
            img.alt = `Görsel bulunamadı: pdfpdf-${String(number).padStart(2, "0")}`;
            img.style.background = "#fff1f2";
            img.style.padding = "16px";
            img.style.objectFit = "contain";
            img.title = "GitHub images klasöründeki dosya adını kontrol edin.";
            img.dataset.failed = "true";
            updateLoadingStatus();
            return;
          }

          img.src = urls[candidateIndex++];
        }

        img.onload = () => {
          resolved = true;
          updateLoadingStatus();
        };

        img.onerror = tryNext;
        img.src = urls[candidateIndex++];

        page.appendChild(img);
        return page;
      }

      function updateLoadingStatus() {
        const imgs = book.querySelectorAll("img");
        const loaded = [...imgs].filter(
          img => img.complete && img.naturalWidth > 0
        ).length;

        loadingMessage.textContent =
          `Sayfalar hazırlanıyor: ${loaded}/${TOTAL}`;

        if (errors.length) {
          loadingError.hidden = false;
          loadingError.textContent =
            "Bulunamayan dosya numaraları: " +
            [...new Set(errors)].join(", ") +
            ". GitHub deposundaki images klasörünü kontrol edin.";
        }
      }

      function hideLoader() {
        loader.classList.add("hidden");
      }

      function showError(message) {
        spinner.hidden = true;
        loadingMessage.textContent = "Kılavuz açılamadı";
        loadingError.hidden = false;
        loadingError.textContent = message;
      }

      function updateUI(index) {
        const current = Math.max(0, Math.min(index, TOTAL - 1));

        counter.innerHTML =
          `Sayfa ${current + 1} / ${TOTAL}` +
          `<small>2026 – 2027 · Veli Kılavuzu</small>`;

        progress.style.width = ((current + 1) / TOTAL * 100) + "%";

        prevButton.disabled = current <= 0;
        nextButton.disabled = current >= TOTAL - 1;
      }

      function initBook() {
        if (!window.St || !window.St.PageFlip) {
          showError(
            "Sayfa çevirme kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip sayfayı yenileyin."
          );
          return;
        }

        try {
          pageFlip = new St.PageFlip(book, {
            width: 900,
            height: 506,
            size: "stretch",
            minWidth: 280,
            maxWidth: 1200,
            minHeight: 157,
            maxHeight: 675,
            autoSize: true,
            showCover: true,
            usePortrait: true,
            mobileScrollSupport: false,
            flippingTime: 700,
            maxShadowOpacity: 0.30,
            drawShadow: true,
            startPage: 0,
            startZIndex: 0,
            clickEventForward: true,
            disableFlipByClick: false,
            swipeDistance: 30,
            showPageCorners: true
          });

          pageFlip.loadFromHTML(book.querySelectorAll(".page"));

          pageFlip.on("flip", event => {
            updateUI(event.data);
          });

          pageFlip.on("init", () => {
            updateUI(pageFlip.getCurrentPageIndex());
            hideLoader();
          });

          // init olayı sürüme göre farklı zamanda gelebilir.
          requestAnimationFrame(() => {
            if (pageFlip) {
              updateUI(pageFlip.getCurrentPageIndex());
              hideLoader();
            }
          });

        } catch (error) {
          console.error("PageFlip başlatma hatası:", error);
          showError("Kitap oluşturulamadı. Tarayıcı konsolunu kontrol edin.");
        }
      }

      // Önce sayfa elemanlarını ve görsel adreslerini oluştur.
      pageOrder.forEach((number, index) => {
        book.appendChild(createPage(number, index));
      });

      prevButton.addEventListener("click", () => {
        if (pageFlip) pageFlip.flipPrev();
      });

      nextButton.addEventListener("click", () => {
        if (pageFlip) pageFlip.flipNext();
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          console.warn("Tam ekran açılamadı:", error);
        }
      });

      // Klavyeyle sayfa çevirme.
      document.addEventListener("keydown", event => {
        if (!pageFlip || event.altKey || event.ctrlKey || event.metaKey) return;

        if (event.key === "ArrowRight") pageFlip.flipNext();
        if (event.key === "ArrowLeft") pageFlip.flipPrev();
      });

      // Tam ekrana geçildiğinde görünümü yeniden hesapla.
      document.addEventListener("fullscreenchange", () => {
        if (pageFlip) {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            window.dispatchEvent(new Event("resize"));
          }, 100);
        }
      });

      window.addEventListener("load", initBook, { once: true });
    })();
  </script>
</body>
</html>

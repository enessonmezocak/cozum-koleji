<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kağıthane Çözüm Koleji – Veli Randevu Sistemi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c91524;          /* Çözüm Koleji Kırmızı */
      --primary-hover: #a50f1c;    /* Koyu Kırmızı */
      --primary-soft: #fef2f2;     /* Açık Kırmızı Zemin */
      --primary-border: #fecaca;   /* Yumuşak Kırmızı Çerçeve */
      --surface: #ffffff;          /* Beyaz */
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: transparent;
      padding: 12px;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .booking-wrapper {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border: 1.5px solid var(--primary-border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 12px 36px -8px rgba(201, 21, 36, 0.08);
    }

    /* Üst Başlık */
    .header-area {
      text-align: center;
      margin-bottom: 22px;
      border-bottom: 2px dashed var(--primary-border);
      padding-bottom: 18px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Form Grupları */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
    }

    .form-label span {
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      background-color: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(201, 21, 36, 0.1);
    }

    .slot-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* Saat Seçim Izgarası */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .slot-item {
      border: 1.5px solid var(--border);
      background: #ffffff;
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .slot-time {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .slot-status {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--success);
    }

    .slot-item:hover:not(.disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    /* Seçili Kırmızı Hap */
    .slot-item.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(201, 21, 36, 0.28);
    }

    .slot-item.active .slot-time,
    .slot-item.active .slot-status {
      color: #ffffff;
    }

    /* Dolu Olan Slot */
    .slot-item.disabled {
      background: #f1f5f9;
      border-color: #e2e8f0;
      cursor: not-allowed;
      opacity: 0.55;
    }

    .slot-item.disabled .slot-time {
      color: #94a3b8;
      text-decoration: line-through;
    }

    .slot-item.disabled .slot-status {
      color: var(--primary);
    }

    /* Kırmızı Gönder Butonu */
    .btn-submit {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(201, 21, 36, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 8px 24px rgba(201, 21, 36, 0.35);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Geri Bildirim Mesajları */
    .feedback-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: center;
    }

    .feedback-msg.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .feedback-msg.error {
      display: block;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    @media (max-width: 480px) {
      .slots-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .booking-wrapper {
        padding: 20px 16px;
      }
      .title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

<div class="booking-wrapper">
  <div class="header-area">
    <span class="badge-top">🏛️ Kağıthane Çözüm Koleji</span>
    <h1 class="title">Veli Randevu Sistemi</h1>
    <p class="subtitle">Öğrenci ve veli bilgilerinizi girerek uygun görüşme saatini seçiniz.</p>
  </div>

  <form id="randevuForm">
    <div class="form-group">
      <label class="form-label" for="ogrenciAd">Öğrenci Adı Soyadı <span>*</span></label>
      <input type="text" id="ogrenciAd" class="form-control" placeholder="Örn: Ahmet Yılmaz" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="veliAd">Veli Adı Soyadı <span>*</span></label>
      <input type="text" id="veliAd" class="form-control" placeholder="Örn: Mehmet Yılmaz" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="telefon">Veli Telefon Numarası <span>*</span></label>
      <input type="tel" id="telefon" class="form-control" placeholder="Örn: 0532 123 45 67" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="tarih">Görüşme Tarihi <span>*</span></label>
      <input type="date" id="tarih" class="form-control" required>
    </div>

    <div class="form-group">
      <label class="form-label">Görüşme Saati <span>*</span></label>
      <div class="slot-hint">09:00 - 17:00 arası seanslar (Maksimum 2 veli kontenjanı)</div>
      <div class="slots-grid" id="slotsContainer"></div>
      <input type="hidden" id="seciliSaat" required>
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">
      Randevuyu Onayla ve Takvime Kaydet
    </button>

    <div id="statusBox" class="feedback-msg"></div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcHsj4OWPGKzswOLXTqoqrOyBJTwUFRyNkx4OP1G-k__aYCqckiYWD3sK833CG-02e7w/exec";

  // Sabah 09:00 - 17:00 Seansları (12:00-13:00 Öğle Arası Hariç)
  const SAAT_DILIMLERI = [
    "09:00", "09:30", "10:00", "10:30",
    "11:00", "11:30", "13:00", "13:30",
    "14:00", "14:30", "15:00", "15:30",
    "16:00", "16:30"
  ];

  const tarihInput = document.getElementById("tarih");
  const slotsContainer = document.getElementById("slotsContainer");
  const seciliSaatInput = document.getElementById("seciliSaat");
  const form = document.getElementById("randevuForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusBox = document.getElementById("statusBox");

  const today = new Date().toISOString().split("T")[0];
  tarihInput.min = today;
  tarihInput.value = today;

  function renderSlots(slotCounts = {}) {
    slotsContainer.innerHTML = "";
    seciliSaatInput.value = "";

    SAAT_DILIMLERI.forEach(saat => {
      const booked = slotCounts[saat] || 0;
      const remaining = 2 - booked;
      const isFull = remaining <= 0;

      const div = document.createElement("div");
      div.className = `slot-item ${isFull ? 'disabled' : ''}`;
      
      div.innerHTML = `
        <span class="slot-time">${saat}</span>
        <span class="slot-status">${isFull ? 'Dolu' : remaining + ' Müsait'}</span>
      `;

      if (!isFull) {
        div.onclick = () => {
          document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          seciliSaatInput.value = saat;
        };
      }

      slotsContainer.appendChild(div);
    });
  }

  async function checkAvailability(dateStr) {
    slotsContainer.style.opacity = "0.45";
    try {
      const res = await fetch(`${SCRIPT_URL}?date=${dateStr}`);
      const data = await res.json();
      renderSlots(data.slotCounts || {});
    } catch (e) {
      renderSlots({});
    } finally {
      slotsContainer.style.opacity = "1";
    }
  }

  tarihInput.addEventListener("change", (e) => {
    checkAvailability(e.target.value);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!seciliSaatInput.value) {
      alert("Lütfen bir görüşme saati seçiniz.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Kaydediliyor ve Takvime İşleniyor...";
    statusBox.className = "feedback-msg";
    statusBox.style.display = "none";

    const payload = {
      ogrenciAd: document.getElementById("ogrenciAd").value.trim(),
      veliAd: document.getElementById("veliAd").value.trim(),
      telefon: document.getElementById("telefon").value.trim(),
      tarih: tarihInput.value,
      saat: seciliSaatInput.value
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        statusBox.className = "feedback-msg success";
        statusBox.textContent = "✓ Randevunuz oluşturuldu! Bilgiler okul takvimine işlendi.";
        form.reset();
        tarihInput.value = today;
        checkAvailability(today);
      } else {
        statusBox.className = "feedback-msg error";
        statusBox.textContent = result.message || "Bir hata oluştu.";
      }
    } catch (err) {
      statusBox.className = "feedback-msg success";
      statusBox.textContent = "✓ Randevu talebiniz alındı ve takvime kaydedildi.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Randevuyu Onayla ve Takvime Kaydet";
    }
  });

  checkAvailability(today);
</script>

</body>
</html>
